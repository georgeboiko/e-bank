services:
  user-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${USER_DB_NAME:?}
      POSTGRES_USER: ${USER_DB_USER:?}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - user_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  money-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${MONEY_DB_NAME:?}
      POSTGRES_USER: ${MONEY_DB_USER:?}
      POSTGRES_PASSWORD: ${MONEY_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - money_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  antifraud-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${ANTIFRAUD_DB_NAME:?}
      POSTGRES_USER: ${ANTIFRAUD_DB_USER:?}
      POSTGRES_PASSWORD: ${ANTIFRAUD_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - antifraud_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 20s
      timeout: 30s
      retries: 6
      start_period: 30s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:8085:8080"

volumes:
  user_data:
  money_data:
  antifraud_data:
  kafka_data:
