name: ebank-keycloak

services:
  keycloak-db:
    image: postgres:18
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - keycloak_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "keycloak", "-d", "keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8088/auth}
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: ${KEYCLOAK_PROXY_TRUSTED_ADDRESSES:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KEYCLOAK_WEB_ORIGIN: ${KEYCLOAK_WEB_ORIGIN:-http://localhost:3000}
      KEYCLOAK_WEB_REDIRECT_URI: ${KEYCLOAK_WEB_REDIRECT_URI:-http://localhost:3000/auth/callback}
      KEYCLOAK_EVENTS_CLIENT_SECRET: ${KEYCLOAK_EVENTS_CLIENT_SECRET:?}
      KEYCLOAK_TEST_CLIENT_PASSWORD: ${KEYCLOAK_TEST_CLIENT_PASSWORD:?}
      KEYCLOAK_TEST_ANALYST_PASSWORD: ${KEYCLOAK_TEST_ANALYST_PASSWORD:?}
      KEYCLOAK_TEST_ADMIN_PASSWORD: ${KEYCLOAK_TEST_ADMIN_PASSWORD:?}
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - ./ebank-realm.json:/opt/keycloak/data/import/ebank-realm.json:ro

volumes:
  keycloak_data:
