events {}

http {
    server {
        listen 80;
        server_name ebank.example.invalid;

        return 308 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;
        server_name ebank.example.invalid;

        # TODO: указать пути к сертификату и приватному ключу при развёртывании.
        ssl_certificate #TODO
        ssl_certificate_key #TODO
        ssl_protocols TLSv1.2 TLSv1.3;

        location ~ ^/api/(users|money|antifraud)/v1/health(/|$) {
            return 404;
        }

        include routes.conf;
    }
}
